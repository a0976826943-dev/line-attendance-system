<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>員工出勤系統｜LINE 登入測試</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f7f8;margin:0;padding:24px;color:#243443}
    main{max-width:440px;margin:25px auto;background:white;padding:24px;border-radius:14px;box-shadow:0 2px 14px #00000012}
    h1{font-size:24px;color:#128253}p{line-height:1.6}button{padding:14px 18px;background:#06a568;color:#fff;border:0;border-radius:10px;width:100%;font-size:17px;margin-top:12px}button:disabled{opacity:.55}
    #status{white-space:pre-wrap;padding:12px;background:#edf4f6;border-radius:8px;overflow-wrap:anywhere}#status.error{background:#ffebea;color:#9f2929}#status.ok{background:#e1f5e9;color:#14643e}
    .hidden{display:none}small{color:#667585}
  </style>
</head>
<body>
<main>
  <h1>員工出勤系統</h1>
  <p>LINE LIFF 登入測試（目前不會執行打卡）</p>
  <div id="status" role="status">準備初始化 LIFF...</div>
  <button id="login" class="hidden" onclick="login()">使用 LINE 登入</button>
  <button id="retry" class="hidden" onclick="initialize()">重新檢查</button>
  <p id="profile"></p>
  
<section id="bindSection" class="hidden">
  <h2>員工 LINE 身分綁定</h2>
  <p>首次使用請輸入員工編號及一次性啟用碼。</p>

  <label for="employeeCode">員工編號</label>
  <input
    id="employeeCode"
    type="text"
    placeholder="例如 E001"
    maxlength="40"
    autocomplete="off"
  >

  <label for="enrollmentCode">一次性啟用碼</label>
  <input
    id="enrollmentCode"
    type="password"
    placeholder="請輸入管理員提供的啟用碼"
    maxlength="100"
    autocomplete="off"
  >

  <button id="bindButton" type="button" disabled>
    綁定 LINE 帳號
  </button>

  <p id="bindStatus" role="status" aria-live="polite"></p>
</section>
  
<small>目前為測試版：LINE 登入與員工身分綁定需經後端驗證；GPS 定位與上下班打卡功能尚未啟用。</small>


</main>
<script>
  // 將下方文字改成 LINE Developers 顯示的真正 LIFF ID。
  const LIFF_ID = '2012143443-M9lfVJYA';
  const statusElement = document.getElementById('status');
  const loginButton = document.getElementById('login');
  const retryButton = document.getElementById('retry');
  const profileElement = document.getElementById('profile');
  
const bindSection = document.getElementById('bindSection');
const employeeCodeInput = document.getElementById('employeeCode');
const enrollmentCodeInput = document.getElementById('enrollmentCode');
const bindButton = document.getElementById('bindButton');
const bindStatus = document.getElementById('bindStatus');

  function setStatus(message, kind = '') {
    statusElement.textContent = message;
    statusElement.className = kind;
  }

  async function initialize() {
    loginButton.classList.add('hidden');
    retryButton.classList.add('hidden');
    profileElement.textContent = '';
    
bindSection.classList.add('hidden');
bindButton.disabled = true;
employeeCodeInput.value = '';
enrollmentCodeInput.value = '';
bindStatus.textContent = '';
employeeCodeInput.readOnly = false;
enrollmentCodeInput.readOnly = false;

    
    if (LIFF_ID === 'REPLACE_WITH_LIFF_ID') {
      setStatus('尚未填入 LIFF ID，請先修改網頁程式碼。', 'error');
      return;
    }
    if (!window.liff) {
      setStatus('LIFF SDK 無法載入，請檢查網路。', 'error');
      return;
    }
    setStatus('正在啟動 LINE LIFF...');
    try {
      await Promise.race([
        liff.init({ liffId: LIFF_ID }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('LIFF 初始化超過 15 秒')), 15000))
      ]);
      if (!liff.isLoggedIn()) {
        setStatus('LIFF 初始化成功，尚未登入 LINE。');
        loginButton.classList.remove('hidden');
        return;
      }
      
const idToken = liff.getIDToken();

if (!idToken) {
  setStatus('LINE 已登入，但尚未取得 ID Token。', 'error');
  return;
}


setStatus('LINE 已登入，正在進行後端身分驗證...', '');

const verified = await verifyIdentityWithBackend(idToken);


if (verified) {
  setStatus('LINE 後端身分驗證成功！', 'ok');

  bindSection.classList.remove('hidden');
  bindButton.disabled = false;
  bindStatus.textContent = '請輸入員工編號與一次性啟用碼，完成 LINE 帳號綁定。';

} else {
  setStatus('LINE 後端身分驗證未通過。', 'error');

  bindSection.classList.add('hidden');
  bindButton.disabled = true;
}



      if (liff.isInClient()) {
        profileElement.textContent = '目前在 LINE 應用程式內開啟。';
      }
    } catch (error) {
      setStatus('LIFF 初始化失敗：' + (error.message || String(error)), 'error');
      retryButton.classList.remove('hidden');
    }
  }

async function verifyIdentityWithBackend(idToken) {
  const response = await fetch(
    'https://line-attendance-api.a0976826943.workers.dev/verify-identity',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        idToken: idToken
      })
    }
  );

  if (!response.ok) {
    throw new Error('後端身分驗證請求失敗');
  }

  const result = await response.json();

  return result.ok === true && result.verified === true;
}

async function bindEmployeeWithBackend(idToken, employeeCode, enrollmentCode) {
  const response = await fetch(
    'https://line-attendance-api.a0976826943.workers.dev/bind-employee',
    {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        idToken: idToken,
        employeeCode: employeeCode,
        enrollmentCode: enrollmentCode
      })
    }
  );

  if (!response.ok) {
    throw new Error('員工綁定請求失敗');
  }

  const result = await response.json();

  return result.ok === true;
}

async function handleBindEmployee() {
  if (bindButton.disabled) return;

  const employeeCode = employeeCodeInput.value.trim();
  const enrollmentCode = enrollmentCodeInput.value.trim();

  if (!employeeCode || !enrollmentCode) {
    bindStatus.textContent = '請輸入員工編號及一次性啟用碼。';
    return;
  }

  bindButton.disabled = true;
  bindStatus.textContent = '正在確認員工綁定資料...';

  try {
    if (!liff.isLoggedIn()) {
      throw new Error('請先登入 LINE');
    }

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error('無法取得 LINE 登入憑證');
    }

    const verified = await verifyIdentityWithBackend(idToken);

    if (!verified) {
      throw new Error('LINE 身分驗證未通過');
    }

    const success = await bindEmployeeWithBackend(
      idToken,
      employeeCode,
      enrollmentCode
    );

    bindStatus.textContent = success
      ? 'LINE 員工身分綁定成功！'
      : '綁定失敗，請確認員工編號及啟用碼，或聯絡管理員';

    
if (success) {
  enrollmentCodeInput.value = '';
  employeeCodeInput.readOnly = true;
  enrollmentCodeInput.readOnly = true;
}

} catch (error) {
  bindStatus.textContent = '綁定失敗，請重新檢查 LINE 登入與員工資料。';
  bindButton.disabled = true;
  bindSection.classList.add('hidden');
  setStatus('LINE 驗證或連線發生問題，請重新檢查登入。', 'error');
} finally {
  if (bindSection.classList.contains('hidden')) {
    bindButton.disabled = true;
  } else {
    bindButton.disabled = employeeCodeInput.readOnly;
  }
}


}

  function login() {
    try {
      liff.login();
    } catch (error) {
      setStatus('LINE 登入啟動失敗：' + (error.message || String(error)), 'error');
    }
  }
  
bindButton.addEventListener('click', handleBindEmployee);
  window.addEventListener('load', initialize);
</script>
</body>
</html>
